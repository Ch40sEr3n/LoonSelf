name: Update verified Loon rules
on:
  schedule:
    - cron: '23 0 * * *' # 北京时间 08:23
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: '已审阅上游大幅变更，允许本次更新'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['config/**', 'configs/**', 'rules/custom/**', 'scripts/**', 'tests/**', '.github/workflows/sync.yml']
permissions:
  contents: write
concurrency:
  group: sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test updater
        run: python -m unittest discover -s tests -v
      - name: Fetch and verify upstream release
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ALLOW_LARGE_CHANGE" = "true" ]; then
            python scripts/sync_rules.py --allow-large-change
          else
            python scripts/sync_rules.py
          fi
      - name: Verify generated files
        run: python scripts/sync_rules.py --check
      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LoonKit.lcf rules/upstream state LICENSE LICENSES
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified rules and generated profile'
            git push origin HEAD:main
          fi
