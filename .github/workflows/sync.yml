name: Verify published Loon profile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['LoonKit.lcf', 'config/**', 'rules/**', 'state/**', 'scripts/**', 'tests/**', '.github/workflows/sync.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test public consistency checker
        run: python -m unittest discover -s tests -v
      - name: Verify published files
        run: python scripts/sync_rules.py --check
